name: ci

on:
  push:
    branches: ["development", "testing", "staging", "production", "mission/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Ruff
        run: PYTHONPATH=src python -m ruff check src tests examples
      - name: mypy
        run: PYTHONPATH=src python -m mypy src examples
      - name: Build package
        run: python -m build
